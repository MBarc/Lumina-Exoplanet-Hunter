<!DOCTYPE html>
<!-- Source for social-preview.png (GitHub social preview, 1280x640).
     Re-render: open at a 1280x640 viewport and screenshot. Colors from colors.md. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --space-black: #04090f;
    --deep-navy: #0d1f3c;
    --cyan: #00c8ff;
    --gold: #ffd166;
    --green: #06d6a0;
    --light: #e8f4ff;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 24% 50%, var(--deep-navy) 0%, var(--space-black) 62%);
    color: var(--light);
    font-family: 'Trebuchet MS', 'Gill Sans', Arial, sans-serif;
    display: flex; align-items: center;
    padding: 64px 72px; gap: 64px;
  }
  .logo { width: 400px; height: 400px; flex: none; }
  .copy { flex: 1; }
  .eyebrow {
    color: var(--cyan); font-size: 36px; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 18px;
  }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 700; margin-bottom: 24px; }
  h1 em { font-style: normal; color: var(--green); }
  p { font-size: 32px; line-height: 1.35; color: var(--light); opacity: 0.9; max-width: 660px; }
  .disclaimer { margin-top: 28px; font-size: 28px; color: var(--light); opacity: 0.7; }
</style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="">
  <div class="copy">
    <div class="eyebrow">Lumina</div>
    <h1>Searching Kepler data for <em>new worlds</em></h1>
    <p>Volunteer computers scan NASA's public Kepler observations for tiny dips in starlight that could signal a planet.</p>
    <div class="disclaimer">Independent project &middot; Not affiliated with NASA</div>
  </div>
</body>
</html>
